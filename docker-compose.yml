services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: sniper
      POSTGRES_PASSWORD: sniper
      POSTGRES_DB: sniper
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  poller:
    build: backend/
    environment:
      DATABASE_URL: postgresql+psycopg://sniper:sniper@db:5432/sniper
    env_file: backend/.env
    depends_on:
      - db
volumes:
  pgdata:
